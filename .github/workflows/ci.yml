name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_needed: ${{ steps.deploy_changes.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run build
      - run: npm run cf:dry-run

      - name: Detect deploy-relevant changes
        id: deploy_changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [[ "${before}" =~ ^0+$ ]]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git diff --quiet "${before}" "${{ github.sha }}" -- \
            src \
            worker \
            public \
            migrations \
            index.html \
            package.json \
            vite.config.ts \
            wrangler.jsonc \
            .github/workflows/ci.yml; then
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - run: npm run deploy
