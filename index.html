<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15191d" />
    <script>
      (() => {
        let saved = null;
        try {
          saved = window.localStorage.getItem('air-alert-theme');
        } catch {
          // Storage can be unavailable in hardened/private browser contexts.
        }

        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#15191d' : '#f5f6f7');

        window.__airAlertBootReady = false;
        const showBootFallback = () => {
          if (window.__airAlertBootReady) return;
          document.getElementById('boot-fallback')?.classList.add('boot-fallback--visible');
        };

        window.setTimeout(showBootFallback, 6000);
        window.addEventListener('error', showBootFallback);
        window.addEventListener('unhandledrejection', showBootFallback);
      })();
    </script>
    <style>
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f6f7;
        color: #20272e;
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 120ms ease;
      }

      :root[data-theme='dark'] #boot-fallback {
        background: #15191d;
        color: #edf0f2;
      }

      #boot-fallback.boot-fallback--visible {
        opacity: 1;
        visibility: visible;
      }

      #boot-fallback strong,
      #boot-fallback span {
        display: block;
      }

      #boot-fallback strong {
        margin-bottom: 6px;
        font-size: 17px;
      }

      #boot-fallback span {
        max-width: 420px;
        opacity: 0.72;
      }
    </style>
    <meta
      name="description"
      content="Historical air-alert, attack and consequence statistics for Kyiv City and Kyiv Oblast."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Air Alert Stat" />
    <title>Air Alert Stat — Київ</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" role="alert" aria-live="assertive">
      <div>
        <strong>Не вдалося завантажити інтерфейс</strong>
        <span>Оновіть сторінку. Якщо проблема повторюється, це помилка застосунку, а не відсутність даних.</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
